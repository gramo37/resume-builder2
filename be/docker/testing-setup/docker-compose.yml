services:
  postgres:
    image: postgres:16-alpine
    container_name: applyant-testing-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: applyant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - applyant_testing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d applyant"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: applyant-be:local
    container_name: applyant-testing-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: applyant
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-to-a-long-random-string
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  applyant_testing_pgdata:
