name: Deploy Resume Builder Frontend

on:
  push:
    branches:
      - master
    paths:
      - "fe/**"
      - "be/cdk/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: resume-builder-frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: ResumeBuilderFrontendStack
  CDK_DIR: be/cdk

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: fe
        run: npm ci

      - name: Build frontend
        working-directory: fe
        run: npm run build
        env:
          VITE_API_BASE_URL: https://resume-builder-api.gramo37.in

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install infrastructure dependencies
        working-directory: ${{ env.CDK_DIR }}
        run: npm ci

      - name: CDK deploy
        working-directory: ${{ env.CDK_DIR }}
        run: npx cdk deploy ${{ env.STACK_NAME }} --require-approval never
