name: Deploy Resume Builder Backend

on:
  push:
    branches:
      - master
    paths:
      - "be/**"
      - "!be/cdk/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: resume-builder-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "526955697352"
  ECR_REGISTRY: 526955697352.dkr.ecr.us-east-1.amazonaws.com
  API_REPOSITORY: resume-builder/backend
  EC2_HOST: 54.227.33.240
  EC2_USER: ec2-user
  EC2_COMPOSE_DIR: /home/ec2-user/resume-builder

jobs:
  deploy:
    name: Build image and deploy on EC2
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          api_image="${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --tag "${api_image}" \
            --tag "${ECR_REGISTRY}/${API_REPOSITORY}:latest" \
            be

          docker push "${api_image}"
          docker push "${ECR_REGISTRY}/${API_REPOSITORY}:latest"

          echo "api_image=${api_image}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Read ECR password for the instance
        id: ecr
        run: |
          password="$(aws ecr get-login-password --region "${AWS_REGION}")"
          echo "::add-mask::${password}"
          echo "password=${password}" >> "$GITHUB_OUTPUT"

      - name: Replace containers on EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          ECR_PASSWORD: ${{ steps.ecr.outputs.password }}
          IMAGE_TAG: ${{ steps.images.outputs.image_tag }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ECR_REGISTRY,API_REPOSITORY,ECR_PASSWORD,IMAGE_TAG,EC2_COMPOSE_DIR
          script: |
            set -euo pipefail
            cd "${EC2_COMPOSE_DIR}"

            sudo docker compose stop
            sudo docker compose rm -f

            sudo docker rmi -f "applyant-be:latest" || true
            sudo docker rmi -f "${ECR_REGISTRY}/${API_REPOSITORY}:latest" || true
            sudo docker rmi -f "${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}" || true

            echo "${ECR_PASSWORD}" | sudo docker login \
              --username AWS \
              --password-stdin \
              "${ECR_REGISTRY}"

            sudo docker pull "${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}"
            sudo docker tag \
              "${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}" \
              applyant-be:latest

            sudo docker compose up -d
            sudo docker compose ps
