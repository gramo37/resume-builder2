name: Deploy Resume Builder Backend

on:
  push:
    branches:
      - master
    paths:
      - "be/**"
      - "!be/cdk/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: resume-builder-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "526955697352"
  ECR_REGISTRY: 526955697352.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER_NAME: ResumeBuilderCluster
  SERVICE_NAME: ResumeBuilderService
  TASK_FAMILY: ResumeBuilderTask
  API_CONTAINER: ResumeBuilderApi
  API_REPOSITORY: resume-builder/backend

jobs:
  deploy:
    name: Build image and deploy ECS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log deploy role ARN
        run: echo "AWS_DEPLOY_ROLE_ARN=${{ secrets.AWS_DEPLOY_ROLE_ARN }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          api_image="${ECR_REGISTRY}/${API_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --tag "${api_image}" \
            --tag "${ECR_REGISTRY}/${API_REPOSITORY}:latest" \
            be

          docker push "${api_image}"
          docker push "${ECR_REGISTRY}/${API_REPOSITORY}:latest"

          echo "api_image=${api_image}" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        env:
          API_IMAGE: ${{ steps.images.outputs.api_image }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

          jq \
            --arg api_name "${API_CONTAINER}" \
            --arg api_image "${API_IMAGE}" \
            '
              .containerDefinitions |= map(
                if .name == $api_name then .image = $api_image
                else .
                end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
            ' task-definition.json > task-definition-new.json

      - name: Register task definition
        id: task
        run: |
          arn="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=${arn}" >> "$GITHUB_OUTPUT"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${CLUSTER_NAME}" \
            --service "${SERVICE_NAME}" \
            --task-definition "${{ steps.task.outputs.arn }}" \
            --force-new-deployment

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${CLUSTER_NAME}" \
            --services "${SERVICE_NAME}"
